name: Global AI JobPilot Daily Search
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-jobpilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Collect public employer board jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMPLOYER_BOARDS: ${{ vars.EMPLOYER_BOARDS || 'greenhouse:anthropic,greenhouse:stripe,greenhouse:scaleai,greenhouse:gitlab,greenhouse:canonical,greenhouse:databricks,greenhouse:cloudflare,greenhouse:figma,lever:palantir,lever:spotify,ashby:openai,ashby:elevenlabs,ashby:perplexity,ashby:cursor,ashby:linear,ashby:synthesia,ashby:ramp,ashby:writer' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.daily
        working-directory: backend
